<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MURDOKU</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="start-screen" id="startScreen">
        <div class="start-screen__card">
            <h1>MURDOKU</h1>
            <p>Resuelve el primer caso para descubrir al asesino.</p>
            <button class="btn-primary start-screen__button" id="startButton">JUGAR</button>
            <button class="btn-primary tutorial__button" id="tutorialButton">TUTORIAL</button>
        </div>
    </div>
    <div class="tutorial-screen is-hidden" id="tutorialScreen">
        <!-- Contenido del tutorial -->
    </div>
    <div class="container is-hidden" id="gameContainer">
        <h1 class="titleText" id="titleText"></h1>
        <div class="game-container">
            <div class="clues-panel">
                <div class="clues" id="cluesContainer">
                <!-- Las pistas se generarán con JavaScript -->
                </div>
            </div>

            <div class="control-panel">
           
                <div class="game-board" id="gameBoard">
                    <!-- El tablero se generará con JavaScript -->
                </div>
            </div>
        </div>
        <p class="principal-text" id="principalText"></p>
        <div class="input-group">   
            <input class="form-control" type="text" id="suspectInput" placeholder="Introduce el nombre del asesino">
            <button class="btn-primary" id="checkButton">COMPROBAR</button>
            <button class="btn-primary is-hidden" id="nextPuzzleButton">SIGUIENTE PUZZLE</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
