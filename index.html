<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MURDOKU</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1>MURDOKU</h1>
    </div>
    <div class="container">
        <div class="clues-panel">
            <div class="clues" id="cluesContainer">
                <!-- Las pistas se generarán con JavaScript -->
            </div>
        </div>

        <div class="control-panel">
           
            <div class="game-board" id="gameBoard">
            <!-- El tablero se generará con JavaScript -->
            </div>
            <div class="input-group">   
                <input class="form-control" type="text" id="suspectInput" placeholder="Introduce el nombre del asesino">
                <button class="btn btn-primary" id="checkButton">COMPROBAR</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
